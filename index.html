<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Track BCS and IT exam preparation — chapters, deadlines and progress." />
    <meta name="theme-color" content="#f5f7fa" />
    <title>Study Tracker — BCS &amp; IT Preparation</title>
    <script>
      // Light by default; dark only when the user has chosen it. Applied before paint (no flash).
      (function () {
        var t = null;
        try { t = localStorage.getItem("gst.theme"); } catch (e) {}
        var theme = t === "dark" ? "dark" : "light";
        document.documentElement.setAttribute("data-theme", theme);
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta && theme === "dark") meta.setAttribute("content", "#0f1623");
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
